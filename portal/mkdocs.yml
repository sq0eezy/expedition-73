site_name: Expedition 73 · Proje Hafızası
site_description: NASA Space Apps için fikirler, veri kaynakları, mimari önerileri, kararlar ve ekip takibi.
site_url: https://sq0eezy.github.io/expedition-73/
repo_url: https://github.com/sq0eezy/expedition-73
repo_name: sq0eezy/expedition-73
edit_uri: edit/main/portal/docs/
docs_dir: docs
site_dir: site
extra:
  portal_reader:
    project_id: expedition-73-sq0eezy-2026
    review_page: review/index.md
    dependencies:
      research/REGION_CANDIDATES.md:
        - research/REGION_CATALOG_CHECK.json
      evidence/REGION_RESEARCH.md:
        - research/REGION_CATALOG_CHECK.json
watch:
  - scripts/mkdocs_hooks.py
  - scripts/reader_hooks.py
theme:
  name: material
  language: tr
  font: false
  features:
    - content.action.edit
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - toc.follow
    - search.suggest
    - search.highlight
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: amber
      toggle:
        icon: material/brightness-7
        name: Koyu temaya geç
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: amber
      toggle:
        icon: material/brightness-4
        name: Açık temaya geç
plugins:
  - search
hooks:
  - scripts/mkdocs_hooks.py
  - scripts/reader_hooks.py
markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
extra_css:
  - stylesheets/portal.css
  - stylesheets/reader.css
extra_javascript:
  - javascripts/reader.js
nav:
  - Başlangıç: index.md
  - Kontrol merkezi:
      - Genel bakış: control-center/index.md
      - Değişiklikler ve incelemem: review/index.md
      - Mevcut durum: CURRENT_STATE.md
      - Çalışma günlüğü: control-center/WORK_LOG.md
      - Kanıtlar: evidence/index.md
      - Portal doğrulaması: evidence/PORTAL_SETUP.md
      - Ekip doğrulaması: evidence/TEAM_SETUP.md
      - GitHub aktarımı: evidence/GITHUB_SHARE.md
      - Mac kurulum hazırlığı: evidence/MACOS_SETUP.md
      - Bölge araştırması: evidence/REGION_RESEARCH.md
      - Web yayını hazırlığı: evidence/PAGES_SETUP.md
      - Modül tasarım kaydı: evidence/MODULE_DESIGN.md
      - Modül yürütme denemesi: evidence/WORKFLOW_ENGINE.md
      - Gerçek verili modül akışı: evidence/SURFACE_WORKFLOW.md
      - Aday modül akışı yayını: evidence/SURFACE_RELEASE.md
      - İlk T2M API ve adaptör: evidence/T2M_POINT_PROBE.md
      - İlk T2M alan hesabı: evidence/T2M_WINDOW_PROBE.md
      - Parçalı T2M erişimi: evidence/T2M_TILING.md
      - Maske hazırlığı ve kontroller: evidence/SURFACE_MASK_CHECK.md
      - Gerçek Earthdata metadata erişimi: evidence/EARTHDATA_METADATA.md
      - Fraksiyon dönüşümü kontrolleri: evidence/SURFACE_SUBSET_CHECK.md
  - Proje:
      - Bağlam ve hedef: PROJECT_CONTEXT.md
      - Belge haritası: DOCUMENTATION_MAP.md
      - Terimler: GLOSSARY.md
  - Ekip:
      - Ortak alan: team/index.md
      - Emeç Yıldız: team/members/M1.md
      - sq0eezy: team/members/M2.md
      - Fikir alışverişi: team/IDEAS.md
      - Bölge ve modül tartışması: team/ideas/IDEA-M1-001.md
      - Devir ve sorular: team/HANDOFFS.md
      - Birlikte çalışma: team/WORKFLOW.md
      - Paylaşım ve eşitleme: team/SYNC.md
  - Ürün fikri:
      - Deneyim ve kapsam: product/index.md
      - İlk yerel sonuç ekranı: product/RESULTS_PREVIEW.md
      - Sonuç ekranı doğrulaması: evidence/RESULTS_PREVIEW_CHECK.md
      - Hücre görünümü doğrulaması: evidence/SPATIAL_PREVIEW_CHECK.md
      - Aday ağırlık karşılaştırması: evidence/POLICY_COMPARISON_CHECK.md
      - Hipotezler: product/HYPOTHESES.md
  - Keşif ve veri:
      - Açık sorular: discovery/index.md
      - Fikir karşılaştırması: discovery/IDEA_COMPARISON.md
      - Varsayımlar: discovery/ASSUMPTIONS.md
      - Araştırma kaydı: research/index.md
      - NASA veri kaynakları: research/DATA_SOURCES.md
      - Kara/su maskesi adayı: research/SURFACE_MASK.md
      - Maske kapsamı ve sınır varsayımları: research/SURFACE_SUPPORT.md
      - Kaynak AREA uygunluğu: research/SOURCE_AREA.md
      - Gerçek AREA metadata kontrolü: evidence/SOURCE_AREA_CHECK.md
      - Gerçek alan kapsamı denetimi: evidence/SURFACE_SUPPORT_CHECK.md
      - Bölge seçimi ve iki aday: research/REGION_CANDIDATES.md
      - Bölge A çalışma fişi: research/regions/REGION_A_PROFILE.md
      - Bölge B çalışma fişi: research/regions/REGION_B_PROFILE.md
      - Bilimsel kontrol noktaları: research/SCIENCE_NOTES.md
  - Mimari:
      - Genel bakış: architecture/index.md
      - Modüller ve bağlantılar: architecture/MODULE_SYSTEM.md
      - Bölge ve modül önerisi: architecture/REGIONAL_MODULE_PROPOSAL.md
      - Sistem haritası: architecture/SYSTEM_MAP.md
      - Veri ve akışlar: architecture/DATA_AND_FLOWS.md
      - Sınırlar: architecture/BOUNDARIES.md
  - Plan ve ekip:
      - Yol haritası: planning/index.md
      - İlk pilot · Hava sıcaklığı: planning/PILOT.md
      - İş bölümü ve ortak profil: planning/REGION_WORKFLOW.md
      - Bölge A ve modül görevleri: planning/REGION_A.md
      - Bölge B yapılacaklar: planning/REGION_B.md
      - İş panosu: planning/WORK_BOARD.md
      - Riskler: planning/RISKS.md
  - Kararlar:
      - Karar dizini: decisions/index.md
      - Portal kullanımı: decisions/ADR-001-PORTAL.md
      - GitHub paylaşımı: decisions/ADR-002-GITHUB-SHARING.md
      - Ortak web paneli: decisions/ADR-003-WEB-PORTAL.md
      - Modül ve pilot kararı: decisions/ADR-004-MODULES-AND-PILOT.md
      - Modül ve bölge sorumluları: decisions/ADR-005-TEAM-OWNERSHIP.md
      - İlk T2M teknik dilimi: decisions/ADR-006-T2M-POINT-ADAPTER.md
      - Ayrı geliştirme dalları: decisions/ADR-007-FEATURE-BRANCHES.md
