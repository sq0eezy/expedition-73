name: T2M adapter checks

on:
  push:
    branches: [main]
    paths: ['analysis/**', '.github/workflows/analysis-checks.yml']
  pull_request:
    paths: ['analysis/**', '.github/workflows/analysis-checks.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  adapter:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: analysis
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: analysis/requirements.txt
      - name: Install isolated adapter environment
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Offline provider replay and contract tests
        run: .venv/bin/python -m unittest discover -s tests -v
      - name: Validate committed real samples
        run: |
          .venv/bin/python -m expedition73 validate examples/a-point-2024/result.json
          .venv/bin/python -m expedition73 validate examples/b-point-2024/result.json
          .venv/bin/python -m expedition73 check-alignment examples/a-point-2024/result.json examples/b-point-2024/result.json
      - name: Replay regional geometry, weights and real response
        run: .venv/bin/python -m expedition73 validate-window examples/a-window-2024
      - name: Replay all B tiles and deduplicated window result
        run: .venv/bin/python -m expedition73 validate-tiled-window examples/b-window-2024
