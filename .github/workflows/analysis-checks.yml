name: Recorded T2M and preview checks

on:
  push:
    branches: [main, 'codex/**']
    paths: ['analysis/**', 'web/**', 'scripts/**', 'docker/**', 'Dockerfile', 'compose.yaml', '.dockerignore', '.github/workflows/analysis-checks.yml']
  pull_request:
    paths: ['analysis/**', 'web/**', 'scripts/**', 'docker/**', 'Dockerfile', 'compose.yaml', '.dockerignore', '.github/workflows/analysis-checks.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: recorded-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  native:
    name: Offline checks · ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: analysis/.venv/bin/python
          - os: macos-latest
            python: analysis/.venv/bin/python
          - os: windows-latest
            python: analysis/.venv/Scripts/python.exe
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: docker/requirements.lock
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: Isolated Python setup
        run: python scripts/workspace.py setup
      - name: Complete offline checks and preview build
        run: ${{ matrix.python }} scripts/workspace.py check
      - name: Package and verify public demo
        run: |
          ${{ matrix.python }} scripts/workspace.py package
          ${{ matrix.python }} scripts/workspace.py verify-package web/artifacts/expedition73-preview.zip
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: recorded-preview-${{ matrix.os }}
          path: web/artifacts/expedition73-preview.zip
          if-no-files-found: error
          retention-days: 7
  container:
    name: Docker offline and HTTP · ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        platform: [linux/amd64, linux/arm64]
    env:
      DOCKER_DEFAULT_PLATFORM: ${{ matrix.platform }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
        with:
          platforms: arm64
      - name: Container checks with no runtime network or credentials
        run: docker compose --env-file docker/compose.env -p expedition73-ci run --rm --build checks
      - name: Healthy static preview
        run: docker compose --env-file docker/compose.env -p expedition73-ci up --build --wait --wait-timeout 90 preview
      - name: Public HTTP smoke
        run: python3 scripts/smoke_preview.py
      - name: Stop owned containers
        if: always()
        run: docker compose --env-file docker/compose.env -p expedition73-ci down --remove-orphans
